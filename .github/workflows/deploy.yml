name: Deploy

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 46.32.186.192 >> ~/.ssh/known_hosts

      - name: Push to VPS bare repo
        run: |
          git remote add vps ssh://root@46.32.186.192/opt/aroma.git
          git push --force vps HEAD:main

      - name: Run Alembic migrations
        run: ssh root@46.32.186.192 'cd /opt/aroma && .venv/bin/alembic upgrade head'

      - name: Verify services
        run: |
          ssh root@46.32.186.192 'systemctl is-active aroma-bot'
          ssh root@46.32.186.192 'systemctl is-active threads-oauth'
          ssh root@46.32.186.192 'systemctl is-active aroma-miniapp && echo "miniapp active" || echo "miniapp not running (skip)"'
          ssh root@46.32.186.192 'systemctl is-active n8n-aroma && echo "n8n active" || echo "n8n not running (skip)"'

      - name: Import n8n workflows
        run: |
          for f in n8n/workflows/*.json; do
            ssh root@46.32.186.192 "curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:5678/api/v1/workflows \
              -H 'Content-Type: application/json' \
              -H 'X-N8N-API-KEY: ${{ secrets.N8N_API_KEY }}' \
              --data-binary @-" < "$f" || true
          done

      - name: Smoke test miniapp
        run: |
          ssh root@46.32.186.192 'curl -sf http://127.0.0.1:8091/healthz' || echo "miniapp healthz failed (non-blocking)"

      - name: Run one-time data enrichment scripts (idempotent)
        run: |
          ssh root@46.32.186.192 'cd /opt/aroma && \
            MARKER=/opt/aroma/.enrichment_done && \
            if [ -f "$MARKER" ]; then echo "Enrichment already done, skipping"; exit 0; fi && \
            echo "Running data enrichment scripts..." && \
            .venv/bin/python scripts/cleanup_duplicates.py 2>&1 | tail -3 && \
            .venv/bin/python scripts/cleanup_blend_ingredients.py 2>&1 | tail -3 && \
            .venv/bin/python scripts/generate_name_ru.py 2>&1 | tail -3 && \
            .venv/bin/python scripts/generate_description_short.py 2>&1 | tail -3 && \
            .venv/bin/python scripts/generate_symptom_descriptions.py 2>&1 | tail -3 && \
            touch "$MARKER" && \
            echo "Enrichment complete."' || echo "Enrichment step failed (non-blocking)"

      - name: Fill complementary oils from PDF data (one-time)
        run: |
          ssh root@46.32.186.192 'cd /opt/aroma && \
            MARKER=/opt/aroma/.complementary_oils_done && \
            if [ -f "$MARKER" ]; then echo "Complementary oils already filled, skipping"; exit 0; fi && \
            echo "Filling complementary oils from PDF..." && \
            .venv/bin/python scripts/fill_complementary_oils_from_pdf.py --force 2>&1 | tail -5 && \
            touch "$MARKER" && \
            echo "Complementary oils fill complete."' || echo "Complementary oils step failed (non-blocking)"
