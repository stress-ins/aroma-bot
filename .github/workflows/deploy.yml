name: Deploy

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 46.32.186.192 >> ~/.ssh/known_hosts

      - name: Sync systemd service files
        run: |
          scp deploy/aroma-miniapp.service root@46.32.186.192:/etc/systemd/system/aroma-miniapp.service
          ssh root@46.32.186.192 'systemctl daemon-reload'

      - name: Update nginx config
        run: |
          scp deploy/nginx-miniapp.conf root@46.32.186.192:/etc/nginx/sites-enabled/miniapp
          ssh root@46.32.186.192 'nginx -t && systemctl reload nginx'

      - name: Push to VPS bare repo
        run: |
          git remote add vps ssh://root@46.32.186.192/opt/aroma.git
          git push --force vps HEAD:main

      - name: Ensure Node.js on VPS
        run: |
          ssh root@46.32.186.192 'command -v node >/dev/null 2>&1 || apt-get install -y nodejs'

      - name: Build frontend (Vite)
        run: ssh root@46.32.186.192 'cd /opt/aroma/miniapp && npm ci && npm run build 2>&1 | tail -10'

      - name: Install Remotion dependencies
        run: ssh root@46.32.186.192 'cd /opt/aroma/remotion && npm ci --production 2>&1 | tail -5'

      - name: Install Remotion browser (Chromium)
        run: ssh root@46.32.186.192 'cd /opt/aroma/remotion && npx remotion browser ensure 2>&1 | tail -3'

      - name: Harden secrets file permissions
        run: |
          ssh root@46.32.186.192 'chmod 600 /opt/aroma/.env /opt/aroma/.env.bak.* /opt/aroma/.instagrapi_session.json 2>/dev/null; echo "permissions fixed"'

      - name: Run Alembic migrations
        run: ssh root@46.32.186.192 'cd /opt/aroma && .venv/bin/alembic upgrade head'

      - name: Ensure runtime directories exist
        run: ssh root@46.32.186.192 'mkdir -p /opt/aroma/data /opt/aroma/generated /opt/aroma/assets'

      - name: Restart and verify ALL services
        run: |
          ssh root@46.32.186.192 'systemctl restart aroma-bot'
          # Graceful reload for miniapp (gunicorn HUP — zero-downtime)
          ssh root@46.32.186.192 'systemctl reload aroma-miniapp || systemctl restart aroma-miniapp'
          sleep 5
          ssh root@46.32.186.192 'systemctl is-active aroma-bot'
          ssh root@46.32.186.192 'systemctl is-active threads-oauth'
          ssh root@46.32.186.192 'systemctl is-active aroma-miniapp'
          ssh root@46.32.186.192 'systemctl is-active aroma-monitor && echo "monitor active" || echo "monitor not running (skip)"'
          ssh root@46.32.186.192 'systemctl is-active n8n-aroma && echo "n8n active" || echo "n8n not running (skip)"'

      - name: Import n8n workflows
        run: |
          for f in n8n/workflows/*.json; do
            [ -f "$f" ] || continue
            ssh root@46.32.186.192 "curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:5678/api/v1/workflows \
              -H 'Content-Type: application/json' \
              -H 'X-N8N-API-KEY: ${{ secrets.N8N_API_KEY }}' \
              --data-binary @-" < "$f" || true
          done

      - name: Smoke test miniapp
        run: |
          ssh root@46.32.186.192 '
            for i in $(seq 1 60); do
              curl -sf http://127.0.0.1:8091/readyz > /dev/null 2>&1 && echo "miniapp ready" && exit 0
              sleep 0.5
            done
            echo "ERROR: miniapp not ready after 30s"
            exit 1
          '

      - name: Verify nginx config integrity
        run: ssh root@46.32.186.192 'nginx -t'

  # ── Data enrichment (separate job, non-blocking) ────────────────────
  enrichment:
    needs: deploy
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 46.32.186.192 >> ~/.ssh/known_hosts

      - name: Run cleanup scripts (no AI, safe every deploy)
        run: |
          ssh root@46.32.186.192 'cd /opt/aroma && \
            .venv/bin/python scripts/cleanup_duplicates.py 2>&1 | tail -3 && \
            .venv/bin/python scripts/cleanup_blend_ingredients.py 2>&1 | tail -3' \
            || echo "Cleanup step failed (non-blocking)"

      - name: Patch oil reflection questions (idempotent, no AI)
        run: |
          ssh root@46.32.186.192 'cd /opt/aroma && \
            .venv/bin/python scripts/patch_oil_questions.py 2>&1 | tail -5' \
            || echo "Oil questions patch failed (non-blocking)"

      - name: Fill complementary oils from PDF data (no AI, idempotent)
        run: |
          ssh root@46.32.186.192 'cd /opt/aroma && \
            .venv/bin/python scripts/fill_complementary_oils_from_pdf.py --force 2>&1 | tail -5' \
            || echo "Complementary oils step failed (non-blocking)"

      - name: Populate shop URLs for aroma cards (idempotent)
        run: |
          ssh root@46.32.186.192 'cd /opt/aroma && \
            .venv/bin/python scripts/populate_shop_urls.py 2>&1 | tail -5' \
            || echo "Shop URLs step failed (non-blocking)"

      - name: Run AI enrichment scripts (idempotent, skip if already done)
        run: |
          ssh root@46.32.186.192 'cd /opt/aroma && \
            .venv/bin/python scripts/enrich_name_en.py 2>&1 | tail -3 && \
            .venv/bin/python scripts/generate_name_ru.py 2>&1 | tail -3 & \
            .venv/bin/python scripts/summarize_aroma_fields.py --card-summary 2>&1 | tail -3 & \
            .venv/bin/python scripts/generate_symptom_descriptions.py 2>&1 | tail -3 & \
            wait' || echo "AI enrichment step failed (non-blocking)"
