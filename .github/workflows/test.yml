name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # ── Detect which paths changed ──────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui:
              - 'miniapp/static/**'
              - 'miniapp/templates/**'
              - 'tests/ui/**'

  # ── Backend tests (always run) ──────────────────────────────────────
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: test-token
      REPORT_TARGET_CHAT_ID: test-chat
      UV_SYSTEM_PYTHON: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Install dependencies
        run: uv pip install -r requirements.txt pytest pytest-timeout pytest-xdist pytest-cov

      - name: Run tests
        run: python -m pytest tests/ -q --ignore=tests/ui --ignore=tests/smoke --timeout=60 -n 2 -m "not slow"

  # ── UI tests (only when static files changed) ───────────────────────
  miniapp-ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: test-token
      REPORT_TARGET_CHAT_ID: test-chat
      UV_SYSTEM_PYTHON: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "requirements.txt"

      - name: Install dependencies
        run: uv pip install -r requirements.txt pytest pytest-timeout

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Mini App UI tests
        run: python -m pytest tests/ui/ -v -m "not visual" -x --timeout=60 -o timeout_func_only=false --tb=long --durations=10 -s --no-cov
