name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: test-token
      REPORT_TARGET_CHAT_ID: test-chat
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests/test_utils.py tests/test_formatters.py tests/test_social_oauth.py

  miniapp-ui:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: test-token
      REPORT_TARGET_CHAT_ID: test-chat
      # Always regenerate baselines on CI — pixel-perfect comparison doesn't
      # work across macOS (local) and Ubuntu (CI) due to font rendering differences.
      # Tests still verify that all UI elements load and interactions work.
      UPDATE_VISUAL_BASELINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Mini App UI smoke tests
        run: python -m pytest tests/ui/test_miniapp_ui.py
