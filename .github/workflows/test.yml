name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: test-token
      REPORT_TARGET_CHAT_ID: test-chat
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-timeout

      - name: Run tests
        run: python -m pytest tests/ -q --ignore=tests/ui --ignore=tests/smoke -x --timeout=300

  miniapp-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      TELEGRAM_BOT_TOKEN: test-token
      REPORT_TARGET_CHAT_ID: test-chat
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-timeout

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Mini App UI tests
        timeout-minutes: 2
        run: python -m pytest tests/ui/ -v -m "not visual" -x --timeout=30 -o timeout_func_only=false --tb=long --durations=20 -s
