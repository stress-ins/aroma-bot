<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Арома помощник</title>
    <link rel="stylesheet" href="/static/app.css?v=__ASSET_VERSION__" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="shell">
      <section class="topbar">
        <div class="topbar-main">
          <div class="topbar-copy">
            <p class="eyebrow">Workspace</p>
            <h1 class="topbar-title">Арома помощник</h1>
          </div>
          <div class="mode-selector">
            <button id="modeContent" class="mode-button active" type="button">Контент</button>
            <button id="modeHandbook" class="mode-button" type="button">Справочник</button>
          </div>
        </div>
        <button id="settingsButton" class="icon-corner-button" type="button" aria-label="Настройки">⚙️</button>
      </section>

      <section class="toolbar">
        <div class="tabs" id="tabsContainer">
          <!-- Tabs injected by JS based on mode -->
        </div>
        <div class="toolbar-inner-filters" id="filtersContainer">
          <label>
            Тип
            <select id="kindFilter">
              <option value="">Все</option>
              <option value="threads">Тредс</option>
              <option value="instagram">Инстаграм</option>
              <option value="telegram">Телеграм</option>
              <option value="reels">Рилсы</option>
              <option value="carousel">Карусель</option>
            </select>
          </label>
          <label>
            Статус
            <select id="statusFilter">
              <option value="">Все</option>
              <option value="draft">Черновик</option>
              <option value="in_review">На согласовании</option>
              <option value="approved">Согласовано</option>
              <option value="rejected">Не согласовано</option>
              <option value="published">Опубликовано</option>
            </select>
          </label>
          <label>
            Результат
            <select id="feedbackFilter">
              <option value="">Все</option>
              <option value="worked">Сработало</option>
              <option value="missed">Не сработало</option>
            </select>
          </label>
          <label class="search">
            Поиск
            <input id="queryFilter" type="search" placeholder="Тема, формат, источник" />
          </label>
        </div>
      </section>

      <section id="bootFallback" class="panel boot-fallback">
        <div class="boot-fallback-copy">
          <p class="eyebrow">Загрузка</p>
          <h2 id="bootFallbackTitle">Загружаю интерфейс</h2>
          <p id="bootFallbackText">
            Если экран все еще пустой через пару секунд, попробуйте обновить mini app или открыть его заново.
          </p>
        </div>
        <button id="bootFallbackReload" class="secondary-button" type="button">Попробовать еще раз</button>
      </section>

      <main class="layout" id="mainLayout">
        <section class="panel list-panel" id="listPanel">
          <div class="panel-header">
            <h2 id="listTitle">Черновики</h2>
            <span id="draftCount" class="meta"></span>
          </div>
          <div id="draftList" class="draft-list"></div>
          <div id="emptyState" class="empty" hidden>Ничего не найдено.</div>
        </section>

        <section class="panel detail-panel" id="detailPanel">
          <div id="draftDetail" class="detail-empty">
            Откройте раздел или карточку слева, чтобы продолжить работу.
          </div>
        </section>
      </main>
    </div>
    <nav class="bottom-tab-bar" id="bottomTabBar" aria-label="Навигация">
      <div class="bottom-tab-bar-inner">
        <button class="bottom-tab-btn" id="btnTabDrafts" data-tab="drafts" type="button" aria-label="Список материалов">
          <span class="ui-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"></rect><path d="M8 9h8M8 13h5"></path></svg></span>
        </button>
        <button class="bottom-tab-btn" id="btnTabPlans" data-tab="plans" type="button" aria-label="Контент-планы">
          <span class="ui-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>
        </button>
        <button class="bottom-tab-btn bottom-tab-btn-create" id="btnTabCreate" data-tab="create" type="button" aria-label="Новый материал">
          <span class="ui-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg></span>
        </button>
        <button class="bottom-tab-btn" id="btnTabHandbook" data-tab="aromas" type="button" aria-label="База знаний">
          <span class="ui-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h7l5 5v11H7z"></path><path d="M14 4v5h5"></path></svg></span>
        </button>
        <button class="bottom-tab-btn" id="btnTabSettings" data-tab="settings" type="button" aria-label="Настройки">
          <span class="ui-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5v3"></path><path d="M12 16.5v3"></path><path d="M4.5 12h3"></path><path d="M16.5 12h3"></path><path d="M6.8 6.8l2.1 2.1"></path><path d="M15.1 15.1l2.1 2.1"></path><path d="M17.2 6.8l-2.1 2.1"></path><path d="M8.9 15.1l-2.1 2.1"></path><circle cx="12" cy="12" r="3.2"></circle></svg></span>
        </button>
      </div>
    </nav>
    <script type="module" src="/static/app.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
