<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Aroma Mini App</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Aroma Workspace</p>
          <h1>Черновики, review и Reels</h1>
          <p class="hero-copy">
            MVP Mini App для команды: открыть draft, посмотреть статус, согласовать
            или отметить результат без длинной переписки в чате.
          </p>
        </div>
        <button id="refreshButton" class="ghost-button" type="button">Обновить</button>
      </header>

      <section class="toolbar">
        <div class="tabs">
          <button class="tab-button active" data-tab="drafts" type="button">Drafts</button>
          <button class="tab-button" data-tab="status" type="button">Status</button>
          <button class="tab-button" data-tab="keywords" type="button">Keywords</button>
        </div>
        <label>
          Тип
          <select id="kindFilter">
            <option value="">Все</option>
            <option value="threads">Threads</option>
            <option value="instagram">Instagram</option>
            <option value="telegram">Telegram</option>
            <option value="reels">Reels</option>
            <option value="carousel">Carousel</option>
          </select>
        </label>
        <label>
          Статус
          <select id="statusFilter">
            <option value="">Все</option>
            <option value="draft">draft</option>
            <option value="in_review">in_review</option>
            <option value="approved">approved</option>
            <option value="published">published</option>
          </select>
        </label>
        <label>
          Feedback
          <select id="feedbackFilter">
            <option value="">Все</option>
            <option value="worked">worked</option>
            <option value="missed">missed</option>
          </select>
        </label>
        <label class="search">
          Поиск
          <input id="queryFilter" type="search" placeholder="Тема, формат, источник" />
        </label>
      </section>

      <main class="layout">
        <section class="panel list-panel">
          <div class="panel-header">
            <h2 id="listTitle">Drafts</h2>
            <span id="draftCount" class="meta"></span>
          </div>
          <div id="draftList" class="draft-list"></div>
          <div id="emptyState" class="empty" hidden>Черновики не найдены.</div>
        </section>

        <section class="panel detail-panel">
          <div id="draftDetail" class="detail-empty">
            Выбери draft слева, чтобы открыть детали, сценарий, слайды и статусы.
          </div>
        </section>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
