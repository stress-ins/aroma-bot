<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Арома помощник</title>
    <style>
      /* Critical: inline theme vars so splash colors match before app.css loads */
      body[data-theme="terracotta"]{--bg:#251e18;--brand:#b45c3d;--brand-rgb:180,92,61}
      body[data-theme="racing-green"]{--bg:#0a1810;--brand:#2a8a50;--brand-rgb:42,138,80}
      body[data-theme="champagne"]{--bg:#2a2218;--brand:#c8a86a;--brand-rgb:200,168,106}
      body[data-theme="violet"]{--bg:#1a1428;--brand:#9060c8;--brand-rgb:144,96,200}
      body[data-theme="teal"]{--bg:#060e10;--brand:#3a9098;--brand-rgb:58,144,152}
      body[data-theme="raspberry"]{--bg:#120810;--brand:#b04870;--brand-rgb:176,72,112}
      /* Critical splash styles — visible before external CSS loads */
      .splash{position:fixed;inset:0;z-index:9000;display:flex;align-items:center;justify-content:center;background:var(--bg,#251e18)}
      .splash .brand-loader-letter{color:var(--brand,#b45c3d);font-size:54px;font-weight:700;animation:splash-pulse 1.4s ease-in-out infinite}
      .splash .brand-loader-ring{position:absolute;inset:0;border:2.5px solid rgba(var(--brand-rgb,180,92,61),.18);border-top-color:var(--brand,#b45c3d);border-radius:50%;animation:splash-spin .9s linear infinite}
      .splash .brand-loader{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center}
      @keyframes splash-pulse{0%,100%{opacity:1}50%{opacity:.5}}
      @keyframes splash-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
      body.app-ready .splash{opacity:0;pointer-events:none;transition:opacity .35s ease}
    </style>
    <link rel="stylesheet" href="__VITE_CSS__" />
    <link rel="stylesheet" href="/static/fonts/phosphor/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <script>
      (function(){
        var t=localStorage.getItem("aromara_theme");
        var valid=["terracotta","racing-green","champagne","violet","teal","raspberry"];
        if(t&&valid.includes(t)) document.body.dataset.theme=t;
        else document.body.dataset.theme="terracotta";
      })();
    </script>
    <div id="splash" class="splash" aria-hidden="true">
      <div class="brand-loader splash-loader">
        <div class="brand-loader-ring"></div>
        <span class="brand-loader-letter">А</span>
      </div>
    </div>
    <div class="shell">
      <section class="topbar">
        <div class="topbar-nav-row">
          <div id="topbarNavTabs" class="topbar-nav-tabs"></div>
        </div>
        <div class="topbar-main">
          <h1 class="topbar-title" id="topbarTitle">Вдохновение</h1>
          <div id="topbarTeam" class="topbar-team"></div>
          <div class="mode-selector" style="display:none">
            <button id="modeContent" class="mode-button active" type="button">Контент</button>
            <button id="modeHandbook" class="mode-button" type="button">Справочник</button>
          </div>
        </div>
        <div id="contentSubTabs" class="content-sub-tabs"></div>
      </section>

      <section class="toolbar">
        <div class="tabs-wrapper">
          <div class="tabs" id="tabsContainer" role="tablist">
            <!-- Tabs injected by JS based on mode -->
          </div>
        </div>
      </section>

      <section id="bootFallback" class="panel boot-fallback" hidden>
        <div class="boot-fallback-copy">
          <p class="eyebrow">Загрузка</p>
          <h2 id="bootFallbackTitle">Загружаю интерфейс</h2>
          <p id="bootFallbackText">
            Если экран все еще пустой через пару секунд, попробуйте обновить mini app или открыть его заново.
          </p>
        </div>
        <button id="bootFallbackReload" class="secondary-button" type="button">Попробовать еще раз</button>
      </section>

      <main class="layout" id="mainLayout">
        <section class="panel list-panel" id="listPanel">
          <div class="panel-header">
            <div class="panel-filter-row">
              <div class="filters-collapse" id="filtersContainer">
                <button class="filters-toggle filters-toggle--compact" id="filtersToggleBtn" type="button">
                  <span id="filtersToggleLabel">Фильтры</span>
                  <i class="ph ph-caret-down filters-toggle-icon"></i>
                </button>
                <div class="toolbar-inner-filters filters-body" id="filtersBody" hidden>
                  <!-- Hidden selects (preserve JS filter logic) -->
                  <select id="kindFilter" hidden>
                    <option value="">Все</option>
                    <option value="threads">Threads</option>
                    <option value="instagram">Instagram</option>
                    <option value="telegram">Telegram</option>
                    <option value="reels">Reels</option>
                    <option value="carousel">Карусель</option>
                  </select>
                  <select id="statusFilter" hidden>
                    <option value="">Все</option>
                    <option value="draft">Черновик</option>
                    <option value="in_review">На согласовании</option>
                    <option value="approved">Согласовано</option>
                    <option value="rejected">Не согласовано</option>
                    <option value="published">Опубликовано</option>
                  </select>
                  <select id="feedbackFilter" hidden>
                    <option value="">Все</option>
                    <option value="worked">Сработало</option>
                    <option value="missed">Не сработало</option>
                  </select>
                  <!-- Chip-based filter rows -->
                  <div class="filter-chips-row" id="kindChipsRow">
                    <button class="filter-chip active" data-filter="kind" data-value="">Все типы</button>
                    <button class="filter-chip" data-filter="kind" data-value="threads">Threads</button>
                    <button class="filter-chip" data-filter="kind" data-value="instagram">Instagram</button>
                    <button class="filter-chip" data-filter="kind" data-value="reels">Reels</button>
                    <button class="filter-chip" data-filter="kind" data-value="carousel">Карусель</button>
                  </div>
                  <div class="filter-chips-row" id="statusChipsRow">
                    <button class="filter-chip active" data-filter="status" data-value="">Все</button>
                    <button class="filter-chip" data-filter="status" data-value="approved">Согласовано</button>
                    <button class="filter-chip" data-filter="status" data-value="draft">Черновик</button>
                    <button class="filter-chip" data-filter="status" data-value="published">Опубликовано</button>
                  </div>
                  <!-- Search box -->
                  <div class="search-box">
                    <i data-lucide="search" style="width:14px;height:14px;color:var(--hint)"></i>
                    <input id="queryFilter" type="search" placeholder="Тема, формат, источник..." class="search-input" />
                  </div>
                </div>
              </div>
              <span id="draftCount" class="meta panel-count"></span>
            </div>
            <div id="headerTabs" class="header-tabs" style="display:none"></div>
          </div>
          <div id="draftList" class="draft-list"></div>
          <div id="emptyState" class="empty" hidden>Ничего не найдено.</div>
        </section>

        <section class="panel detail-panel" id="detailPanel">
          <div id="draftDetail" class="detail-empty">
            Откройте раздел или карточку слева, чтобы продолжить работу.
          </div>
        </section>
      </main>
    </div>
    <nav class="bottom-tab-bar" id="bottomTabBar" aria-label="Навигация">
      <div class="bottom-tab-bar-inner">
        <button class="bottom-tab-btn" id="btnTabInspiration" data-tab="inspiration" type="button" aria-label="Идеи">
          <span class="ui-icon"><i class="ph ph-sparkle" style="font-size:26px;display:block;flex-shrink:0"></i></span>
          <span>Идеи</span>
        </button>
        <button class="bottom-tab-btn" id="btnTabContent" data-tab="content" type="button" aria-label="Контент">
          <span class="ui-icon"><i class="ph ph-file-text" style="font-size:26px;display:block;flex-shrink:0"></i></span>
          <span>Контент</span>
        </button>
        <button class="bottom-tab-btn bottom-tab-btn-create" id="btnTabCreate" data-tab="create" type="button" aria-label="Новый материал">
          <span class="ui-icon"><i class="ph ph-plus" style="font-size:26px;display:block;flex-shrink:0"></i></span>
        </button>
        <button class="bottom-tab-btn" id="btnTabHandbook" data-tab="aromas" type="button" aria-label="База знаний">
          <span class="ui-icon"><i class="ph ph-book-open" style="font-size:26px;display:block;flex-shrink:0"></i></span>
          <span>База</span>
        </button>
        <button class="bottom-tab-btn" id="btnTabSettings" data-tab="settings" type="button" aria-label="Настройки">
          <span class="ui-icon"><i class="ph ph-sliders-horizontal" style="font-size:26px;display:block;flex-shrink:0"></i></span>
          <span>Настройки</span>
        </button>
      </div>
    </nav>
    <script type="module" src="__VITE_JS__"></script>
  </body>
</html>
<!-- trigger -->
