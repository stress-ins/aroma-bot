<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Арома помощник</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="shell">

      <header class="hero">
        <div>
          <p class="eyebrow">Арома помощник</p>
          <h1>Черновики и рилсы</h1>
        </div>
        <button id="refreshButton" class="ghost-button" type="button">Обновить</button>
      </header>

      <section class="toolbar">
        <div class="tabs">
          <button class="tab-button"        data-tab="create"   type="button">Создать</button>
          <button class="tab-button"        data-tab="inbox"    type="button">Согласование</button>
          <button class="tab-button active" data-tab="drafts"   type="button">Черновики</button>
          <button class="tab-button"        data-tab="plans"    type="button">Планы</button>
          <button class="tab-button"        data-tab="reels"    type="button">Рилсы</button>
          <button class="tab-button"        data-tab="aromas"   type="button">Ароматы</button>
          <button class="tab-button"        data-tab="status"   type="button">Статус</button>
          <button class="tab-button"        data-tab="keywords" type="button">Ключи</button>
        </div>
        <div class="toolbar-inner-filters">
          <label>
            Тип
            <select id="kindFilter">
              <option value="">Все</option>
              <option value="threads">Тредс</option>
              <option value="instagram">Инстаграм</option>
              <option value="telegram">Телеграм</option>
              <option value="reels">Рилсы</option>
              <option value="carousel">Карусель</option>
            </select>
          </label>
          <label>
            Статус
            <select id="statusFilter">
              <option value="">Все</option>
              <option value="draft">Черновик</option>
              <option value="in_review">На согласовании</option>
              <option value="approved">Согласовано</option>
              <option value="published">Опубликовано</option>
            </select>
          </label>
          <label>
            Результат
            <select id="feedbackFilter">
              <option value="">Все</option>
              <option value="worked">Сработало</option>
              <option value="missed">Не сработало</option>
            </select>
          </label>
          <label class="search">
            Поиск
            <input id="queryFilter" type="search" placeholder="Тема, формат, источник" />
          </label>
        </div>
      </section>

      <main class="layout">
        <section class="panel list-panel">
          <div class="panel-header">
            <h2 id="listTitle">Черновики</h2>
            <span id="draftCount" class="meta"></span>
          </div>
          <div id="draftList" class="draft-list"></div>
          <div id="emptyState" class="empty" hidden>Ничего не найдено.</div>
        </section>

        <section class="panel detail-panel">
          <div id="draftDetail" class="detail-empty">
            Выбери элемент слева.
          </div>
        </section>
      </main>

    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
