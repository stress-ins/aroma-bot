[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 60
timeout_func_only = true
markers =
    visual: snapshot comparison tests (local only, not run on CI)
    skip_zone_check: skip forbidden-zone overlap check for this test
addopts = --cov=bot --cov=miniapp --cov=analytics --cov-report=term-missing:skip-covered --no-cov-on-fail
