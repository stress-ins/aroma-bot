<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Обновление</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #1a1520; color: #e8ddd4; font-family: -apple-system, system-ui, sans-serif; }
  .box { text-align: center; padding: 32px; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(180,92,61,.3);
    border-top-color: #b45c3d; border-radius: 50%; animation: spin 0.8s linear infinite;
    margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h2 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: #9a8d82; margin: 0; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <h2>Обновляю приложение</h2>
  <p>Подождите пару секунд...</p>
</div>
<script>setTimeout(function(){ location.reload(); }, 3000);</script>
</body>
</html>
